# Publishes the default branch each night as the pre-release vX.Y.Z-nightly.<UTC minute>, when
# it changed since the last nightly, and keeps the newest 14 (see "Releasing" in AGENTS.md).
# GitHub turns the schedule off after 60 days without activity in a public repository.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      version: ${{ steps.prepare.outputs.version }}
      previous: ${{ steps.prepare.outputs.previous }}
    steps:
      # A schedule runs on the default branch alone, a dispatch on any.
      - name: Check the branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Nightlies are published from the default branch only, not $GITHUB_REF."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PROJECT_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          export PROJECT_VERSION
          bash .github/nightly.sh prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One at a time with release.yml's, so that the guard sees a release published meanwhile.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          cd assets
          bash ../.github/nightly.sh publish
