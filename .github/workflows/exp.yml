name: exp
on:
  push:
    branches: [exp/ci-measure]
env:
  MAVEN_OPTS: -XX:TieredStopAtLevel=1 -XX:+UseParallelGC
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: probe
        shell: bash --noprofile --norc {0}
        run: |
          el() { echo "$(date +%s.%N) $1" | awk '{printf "%.2f", $1-$2}'; }
          s=$(date +%s.%N); java -version 2>/dev/null; echo "java -version cold: $(el $s)"
          s=$(date +%s.%N); java -version 2>/dev/null; echo "java -version again: $(el $s)"
          s=$(date +%s.%N); mvn -v >/dev/null; echo "mvn -v first: $(el $s)"
          s=$(date +%s.%N); mvn -v >/dev/null; echo "mvn -v again: $(el $s)"
          s=$(date +%s.%N); mvn -B -q -U test-compile >/dev/null 2>&1; echo "cold repo test-compile: $(el $s)"
          for i in 1 2 3; do s=$(date +%s.%N); mvn -B -q clean test-compile -o >/dev/null 2>&1; echo "test-compile $i: $(el $s)"; done
          export MAVEN_OPTS="$MAVEN_OPTS -XX:SharedArchiveFile=$HOME/maven.jsa -XX:+AutoCreateSharedArchive"
          for i in 1 2 3; do s=$(date +%s.%N); mvn -B -q clean test-compile -o >/dev/null 2>&1; echo "test-compile AppCDS $i: $(el $s)"; done
          ls -la $HOME/maven.jsa
          for i in 1 2; do s=$(date +%s.%N); mvn -B -q -o validate >/dev/null 2>&1; echo "validate AppCDS $i: $(el $s)"; done
