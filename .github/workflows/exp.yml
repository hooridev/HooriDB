name: exp
on:
  push:
    branches: [exp/ci-measure]
env:
  MAVEN_OPTS: -XX:TieredStopAtLevel=1 -XX:+UseParallelGC
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        warm: [none, read]
    steps:
      - run: echo "T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: probe
        shell: bash --noprofile --norc {0}
        run: |
          el() { echo "$(date +%s.%N) $1" | awk '{printf "%.1f", $1-$2}'; }
          if [ "${{ matrix.warm }}" = read ]; then
            s=$(date +%s.%N); find "$JAVA_HOME" "$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")" -type f -print0 | xargs -0 cat > /dev/null; echo "pre-read JDK+Maven: $(el $s)"
          fi
          s=$(date +%s.%N); mvn -v >/dev/null || echo FAILED; echo "mvn -v cold: $(el $s)"
          s=$(date +%s.%N); java -version 2>/dev/null; echo "java -version: $(el $s)"
          s=$(date +%s.%N); printf '%s\n' postgres:18 mariadb:12 mysql:9 | xargs -P 3 -n 1 docker pull -q >/dev/null; echo "pull sql parallel: $(el $s)"
          s=$(date +%s.%N); docker save postgres:18 mariadb:12 mysql:9 -o /tmp/sql.tar; echo "save: $(el $s), $(du -m /tmp/sql.tar | cut -f1) MB"
          s=$(date +%s.%N); gzip -1 -c /tmp/sql.tar | wc -c | awk '{print "gzip -1 size MB", $1/1e6}'; echo "gzip: $(el $s)"
          docker rmi -f postgres:18 mariadb:12 mysql:9 >/dev/null; docker image prune -af >/dev/null; sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          s=$(date +%s.%N); docker load -q -i /tmp/sql.tar >/dev/null; echo "load sql from tar (cold cache): $(el $s)"
