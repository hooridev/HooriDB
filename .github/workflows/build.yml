# Builds the release bundle on each platform and keeps it as workflow artifacts. The release and
# the nightly call it, the nightly with its own version, and it runs by hand on any branch,
# without a release, and on a pull request that changes how the bundle is built.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: The version to build as, such as a nightly's, instead of the POMs'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: The version to build as, such as a nightly's, instead of the POMs'
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/build.yml
      - LICENSE
      - app/src/bundle/**
      - app/src/main/java/dev/hoori/db/app/BundleIcon.java
      - app/pom.xml
      - pom.xml

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # Without it every run downloads all of Maven Central's artifacts, which Central
          # answers with HTTP 429 when several runs do so at once.
          cache: maven
      - name: Set the version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.25.2:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      # -U: with the cache, a framework SNAPSHOT could otherwise be up to a day old.
      - run: mvn -B -U -Pbundle verify
      - name: Smoke test
        # Without a window: the launcher, the runtime and the native libraries, which load from
        # the app's folder and are not unpacked into the user's cache.
        run: |
          image=app/target/bundle/image/HooriDB
          launcher=$image/bin/HooriDB
          if [ "$RUNNER_OS" = Windows ]; then launcher=$image/HooriDB.exe; fi
          printf 'size 1000 700 scale 2\nframe\nsnap start\n' > "$RUNNER_TEMP/smoke.txt"
          mkdir "$RUNNER_TEMP/cache"
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" "$launcher" --script "$RUNNER_TEMP/smoke.txt" --out "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/start.png"
          test -z "$(ls -A "$RUNNER_TEMP/cache")"
          test ! -e "${LOCALAPPDATA:-/nonexistent}/rethinkj-ui"
      - name: Installer
        if: runner.os == 'Windows'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          # Git Bash would take /DVersion=... for a path; Maven's own script needs the conversion.
          MSYS_NO_PATHCONV=1 "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" /DVersion="$version" app/src/bundle/HooriDB.iss
      - uses: actions/upload-artifact@v5
        with:
          name: bundle-${{ runner.os }}
          path: app/target/bundle/HooriDB-*
          if-no-files-found: error
