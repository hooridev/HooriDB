# Publishes the release of a tag vX.Y.Z, whose commit has the version X.Y.Z and pins every
# SNAPSHOT it depends on (see "Releasing" in AGENTS.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check the version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the project's version v$version."
            exit 1
          fi
          # Central deletes a SNAPSHOT after 90 days, and a plain one changes with each push.
          if grep -rn --include=pom.xml -e '-SNAPSHOT' .; then
            echo "::error::A release pins each SNAPSHOT to its timestamped version."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum HooriDB-* > SHA256SUMS
          # A SemVer pre-release such as v1.2.3-rc.1 has a "-" before any build metadata after "+".
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) prerelease=--prerelease ;;
            *) prerelease=--prerelease=false ;;
          esac
          gh release create "$GITHUB_REF_NAME" --draft "$prerelease" --verify-tag --title "HooriDB ${GITHUB_REF_NAME#v}" HooriDB-* SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false "$prerelease"
